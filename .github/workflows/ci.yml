name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node --check app.js && node --check animations.js && node --check zip-publish.js && node --check panel-lib.js
      - run: npm run check
      - run: npm test
