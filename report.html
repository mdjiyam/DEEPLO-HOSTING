<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="subpage.css"><link rel="stylesheet" href="animations.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public-config.js"></script><script src="panel-lib.js"></script><script defer src="animations.js"></script><title>Report abuse — DEEPLO HOSTING</title><script defer src="ads.js"></script></head><body><main class="standalone"><div class="ad-slot" data-slot="top"></div><header class="head"><a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-copy"><b>DEEPLO</b><small>HOSTING</small></span></a><a class="btn" href="legal.html">Terms &amp; policies</a></header>
<section class="hero"><div class="eyebrow">TRUST &amp; SAFETY</div><h1>Report abuse<span class="title-dot">.</span></h1><p>Phishing, malware, illegal content or copyright infringement on a DEEPLO-hosted site? Tell us where and why.</p></section>
<section class="panel"><label for="u">SITE URL</label><input id="u" placeholder="https://name.example.com/" maxlength="300"><label for="r">WHAT IS WRONG?</label><textarea id="r" style="min-height:140px" maxlength="2000"></textarea><label for="e">YOUR EMAIL (optional)</label><input id="e" type="email" maxlength="200"><button class="btn primary full" id="go">Send report</button><div id="msg" class="msg"></div></section><div class="ad-slot" data-slot="bottom"></div></main>
<script>
const $=s=>document.querySelector(s);
$('#go').onclick=async()=>{const m=$('#msg');try{if(!DL.api())throw new Error('Reporting is not configured yet (set the Worker URL in public-config.js).');
 const r=await fetch(DL.api()+'/api/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('#u').value.trim(),reason:$('#r').value.trim(),email:$('#e').value.trim()})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Failed');DL.say(m,'Thank you — your report was received.');$('#r').value=''}catch(e){DL.say(m,e.message,1)}};
</script></body></html>
