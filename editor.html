<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="subpage.css"><link rel="stylesheet" href="animations.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public-config.js"></script><script src="panel-lib.js"></script><script defer src="animations.js"></script><title>Code Editor — DEEPLO HOSTING</title></head><body><main class="standalone"><header class="head"><a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-copy"><b>DEEPLO</b><small>HOSTING PANEL</small></span></a><a class="btn" href="index.html">← Dashboard</a></header>
<section class="hero"><div class="eyebrow">PUBLISHED SITES</div><h1>Code editor<span class="title-dot">.</span></h1><p>Edit text files (HTML, CSS, JS, JSON, TXT, SVG) of a site you already published. Saves go live immediately. Rollback restores the version saved before your last re-publish.</p></section>
<section class="panel"><div class="row"><div style="flex:1;min-width:220px"><label for="site">SITE</label><select id="site"></select></div><button class="btn" id="rollback">↶ Roll back to previous version</button></div><div id="msg" class="msg"></div>
<div class="cols"><div class="flist" id="files"></div><div><div class="row"><b id="cur">No file selected</b><button class="btn primary" id="save">Save</button></div><textarea id="ta" spellcheck="false" disabled></textarea></div></div></section></main>
<script>
const $=s=>document.querySelector(s),E=DL.esc,msg=$('#msg');let slug='',path='';
async function sites(){try{const d=await DL.call('/api/sites/list');$('#site').innerHTML=d.sites.map(s=>'<option>'+E(s.slug)+'</option>').join('')||'<option value="">No published sites</option>';slug=$('#site').value;if(slug)files()}catch(e){DL.say(msg,e.message,1)}}
async function files(){slug=$('#site').value;path='';$('#ta').value='';$('#ta').disabled=true;$('#cur').textContent='No file selected';
 try{const d=await DL.call('/api/sites/files?slug='+encodeURIComponent(slug));const ed=/\.(html?|css|m?js|json|txt|svg)$/i;
 $('#files').innerHTML=d.files.filter(f=>ed.test(f.path)).map(f=>'<button data-p="'+E(f.path)+'">'+E(f.path)+' <small>('+(f.size/1024).toFixed(1)+' KB)</small></button>').join('')||'<p class="muted">No editable files.</p>'}catch(e){DL.say(msg,e.message,1)}}
$('#site').onchange=files;
$('#files').onclick=async e=>{const b=e.target.closest('button');if(!b)return;path=b.dataset.p;document.querySelectorAll('#files button').forEach(x=>x.classList.toggle('on',x===b));
 try{const d=await DL.call('/api/sites/file?slug='+encodeURIComponent(slug)+'&path='+encodeURIComponent(path));$('#ta').value=d.content;$('#ta').disabled=false;$('#cur').textContent=path;DL.say(msg,'')}catch(x){DL.say(msg,x.message,1)}};
$('#save').onclick=async()=>{if(!path)return;try{await DL.call('/api/sites/file',{method:'PUT',body:JSON.stringify({slug,path,content:$('#ta').value})});DL.say(msg,'Saved and live.')}catch(x){DL.say(msg,x.message,1)}};
$('#rollback').onclick=async()=>{if(!slug||!confirm('Replace the live site with its previous version?'))return;try{await DL.call('/api/sites/rollback',{method:'POST',body:JSON.stringify({slug})});DL.say(msg,'Rolled back.');files()}catch(x){DL.say(msg,x.message,1)}};
sites();
</script></body></html>
