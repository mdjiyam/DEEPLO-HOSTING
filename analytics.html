<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="subpage.css"><link rel="stylesheet" href="animations.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public-config.js"></script><script src="panel-lib.js"></script><script defer src="animations.js"></script><title>Analytics — DEEPLO HOSTING</title></head><body><main class="standalone"><header class="head"><a class="brand" href="index.html"><span class="brand-mark">D</span><span class="brand-copy"><b>DEEPLO</b><small>HOSTING PANEL</small></span></a><a class="btn" href="index.html">← Dashboard</a></header>
<section class="hero"><div class="eyebrow">TRAFFIC</div><h1>Site analytics<span class="title-dot">.</span></h1><p>Daily page views per published site. Needs the Analytics Engine binding and read token on the Worker (see UPDATE-4.5.md). Views are sampled by Cloudflare, so treat numbers as estimates.</p></section>
<section class="panel"><div class="row"><div style="flex:1;min-width:200px"><label for="site">SITE</label><select id="site"></select></div><div><label for="days">RANGE</label><select id="days"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></div></div><div id="msg" class="msg"></div><div id="chart" style="display:flex;align-items:flex-end;gap:6px;height:220px;margin-top:10px"></div><div id="labels" style="display:flex;gap:6px;margin-top:6px"></div></section></main>
<script>
const $=s=>document.querySelector(s),E=DL.esc,msg=$('#msg');
async function sites(){try{const d=await DL.call('/api/sites/list');$('#site').innerHTML=d.sites.map(s=>'<option>'+E(s.slug)+'</option>').join('')||'<option value="">No published sites</option>';if($('#site').value)draw()}catch(e){DL.say(msg,e.message,1)}}
async function draw(){const slug=$('#site').value;if(!slug)return;try{DL.say(msg,'Loading…');const d=await DL.call('/api/analytics?slug='+encodeURIComponent(slug)+'&days='+$('#days').value);
 const max=Math.max(1,...d.days.map(x=>x.views));$('#chart').innerHTML=d.days.map(x=>'<div title="'+E(x.day)+': '+x.views+'" style="flex:1;background:linear-gradient(#49e98a,#168447);border-radius:6px 6px 0 0;height:'+Math.max(3,Math.round(x.views/max*100))+'%;min-width:6px"></div>').join('');
 $('#labels').innerHTML=d.days.map(x=>'<small style="flex:1;font-size:9px;color:#91a99a;text-align:center;overflow:hidden">'+E(String(x.day).slice(5,10))+'</small>').join('');
 DL.say(msg,d.days.length?('Total views: '+d.days.reduce((n,x)=>n+x.views,0)):'No visits recorded in this range yet.')}catch(e){DL.say(msg,e.message,1)}}
$('#site').onchange=draw;$('#days').onchange=draw;sites();
</script></body></html>
